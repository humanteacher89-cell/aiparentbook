<body>
<header class="bar"><a class="logo" href="">AI시대 <b>부모백과</b></a><a class="by" href="about/">휴먼쌤</a></header>
<main class="pad">
<h1 class="hello">우리 아이, 지금<br>어떤 상황인가요?</h1>
<section class="pick" aria-label="아이 나이"><h2>아이 나이</h2><div class="seg" id="ages"><button type="button" data-age="preschool" aria-pressed="false">유아</button><button type="button" data-age="elementary" aria-pressed="true">초등</button><button type="button" data-age="teen" aria-pressed="false">중고등</button></div></section>
<section class="tiles" id="tiles"><a class="tile hot" href="q/001/" data-ages="elementary"><b>숙제에 AI를 쓰려고 해요</b><small>001</small></a><a class="tile" href="s/start/" data-ages="elementary"><b>처음 AI를 써 보려고 해요</b><small>준비 중</small></a><a class="tile" href="q/004/" data-ages="elementary"><b>AI 답을 그대로 믿어요</b><small>준비 중</small></a><a class="tile" href="q/005/" data-ages="elementary"><b>AI가 틀린 것 같아요</b><small>준비 중</small></a></section>
<p class="empty" id="empty" hidden>이 나이에 맞는 질문은 아직 없어요. 지금은 초등 자녀를 둔 부모님 질문부터 답하고 있어요.</p>
<section class="pick"><h2>새로 올라온 질문</h2><div class="rows"><a class="row" href="q/001/"><b>숙제할 때 아이가 챗GPT를 써도 되나요?</b><span>001</span></a></div></section>
<script>
(function(){var KEY='apb-age',btns=[].slice.call(document.querySelectorAll('#ages button')),tiles=[].slice.call(document.querySelectorAll('#tiles .tile')),empty=document.getElementById('empty');
function set(age){var shown=0;btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.age===age?'true':'false')});tiles.forEach(function(t){var ok=(' '+t.dataset.ages+' ').indexOf(' '+age+' ')>-1;t.hidden=!ok;if(ok)shown++});empty.hidden=shown>0;try{localStorage.setItem(KEY,age)}catch(e){}}
btns.forEach(function(b){b.addEventListener('click',function(){set(b.dataset.age)})});var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}set(saved||'elementary');})();
</script>
</main>
<footer class="foot"><p>AI시대 부모백과 · 질문에 답하는 사람 휴먼쌤 김수현</p><p>광고 없이 운영합니다. 결론과 근거는 누구나 무료로 읽을 수 있어요.</p></footer>
